function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.was = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { renderer.render(scene, camera); return; }
  myTick(dt, g, now);
  const all = people(g);
  effects(g, all);
  drawPeople(g, all, now, t);
  drawParts(dt); drawFloaters(dt);
  moveCamera(g, all, dt);
  renderer.render(scene, camera);
  if (now - lastHud > 100) { lastHud = now; hud(g); }
}
// Drawing: other players and (on non-hosts) bots arrive ~10 times a second; they are drawn LAG ms in
// the past, between the two updates around that moment, so they glide instead of stepping.
const LAG = 150, tracks = new Map(), views = new Map(); // id -> { kid, prop, kind, tag, tagFor }
function feed(id, raw, s, now) {
  let tr = tracks.get(id);
  if (!tr) { tr = { raw: null, buf: [] }; tracks.set(id, tr); }
  if (tr.raw === raw) return tr;
  tr.raw = raw;
  const last = tr.buf[tr.buf.length - 1];
  if (last && Math.hypot(last.x - s.x, last.z - s.z) > 5) tr.buf.length = 0; // a jump (a new round): no sliding across the house
  tr.buf.push({ at: now, x: s.x, z: s.z, h: s.h });
  if (tr.buf.length > 10) tr.buf.shift();
  return tr;
}
function sample(tr, now) {
  const b = tr.buf, t = now - LAG;
  if (b.length === 1 || t <= b[0].at) return b[0];
  for (let i = b.length - 1; i > 0; i--) {
    if (b[i - 1].at > t) continue;
    const p = b[i - 1], q = b[i];
    if (t >= q.at) return q;
    const k = (t - p.at) / Math.max(1, q.at - p.at);
    return { x: p.x + (q.x - p.x) * k, z: p.z + (q.z - p.z) * k, h: p.h + angDiff(q.h, p.h) * k };
  }
  return b[b.length - 1];
}
function dropView(id) { const v = views.get(id); if (!v) return; dropProp(v.prop); if (v.kid) scene.remove(v.kid.g); if (v.tag) scene.remove(v.tag); views.delete(id); }
const youRing = new THREE.Mesh(new THREE.RingGeometry(0.85, 0.95, 36).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7, depthWrite: false }));
youRing.position.y = 0.03; scene.add(youRing);
function drawPeople(g, all, now, t) {
  const seen = new Set(), iSeek = isSeeker(net.sessionId, g), td = Date.now();
  const draw = (id, c, s) => {
    let v = views.get(id);
    if (!v) { v = { kid: null, prop: null, kind: "", tag: null, tagFor: "" }; views.set(id, v); }
    seen.add(id);
    const seeker = isSeeker(id, g) && !(g.found[id] && (g.stun[id] || 0) > td); // a found hider stays a prop for a moment, then pops out
    if (seeker) {
      if (v.prop) { dropProp(v.prop); v.prop = null; v.kind = ""; }
      if (v.kid && v.kid.color !== c.color) { scene.remove(v.kid.g); v.kid = null; } // they picked a new color
      if (!v.kid) { v.kid = makeKid(c.color); v.kid.color = c.color; }
      v.kid.g.position.set(s.x, 0, s.z); v.kid.g.rotation.y = s.h; poseKid(v.kid, c.mv, (g.stun[id] || 0) > td, t);
    } else {
      if (v.kid) { scene.remove(v.kid.g); v.kid = null; }
      if (v.kind !== c.k) { dropProp(v.prop); v.prop = makeProp(c.k, id); v.kind = c.k; }
      v.prop.position.set(s.x, 0, s.z); v.prop.rotation.y = s.h;
      v.prop.position.y = g.phase === "over" ? Math.abs(Math.sin(t * 6 + s.x)) * 0.3 : 0; // the reveal: every hider hops
    }
    // Name tags: seekers always; hiders only for their own team (and everyone at the reveal).
    const label = ATTRACT || c.mine ? "" : seeker || g.phase === "over" || !iSeek ? c.name : "";
    if (v.tagFor !== label) { if (v.tag) scene.remove(v.tag); v.tag = label ? nameTag(label, seeker ? "#fff" : "#9fffc2") : null; if (v.tag) scene.add(v.tag); v.tagFor = label; }
    if (v.tag) v.tag.position.set(s.x, seeker ? 2.7 : 2.2, s.z);
  };
  const live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const c = all.find((o) => o.id === id); if (!c) continue;
    draw(id, c, sample(feed(id, p.p, c, now), now));
  }
  const raw = S.shared.bots;
  for (const c of all.filter((o) => o.bot)) draw(c.id, c, isHost() ? c : sample(feed(c.id, raw, c, now), now));
  draw(net.sessionId, all.find((o) => o.mine), me);
  for (const id of [...views.keys()]) if (!seen.has(id)) { dropView(id); tracks.delete(id); }
  youRing.visible = !ATTRACT; youRing.position.set(me.x, 0.03, me.z); youRing.scale.setScalar(1 + Math.sin(t * 4) * 0.06);
}
/** High and behind you (higher on a tall phone). ?attract follows the first seeker. */
function moveCamera(g, all, dt) {
  let f = me;
  if (ATTRACT) f = all.find((c) => c.id === g.seek0[0]) || me;
  const tall = camera.aspect < 1, hgt = ATTRACT ? 13 : tall ? 22 : 15, back = ATTRACT ? 6 : 10;
  camGoal.set(f.x, 0, f.z);
  camLook.lerp(camGoal, 1 - Math.pow(ATTRACT ? 0.08 : 0.004, dt));
  shake = Math.max(0, shake - dt);
  camera.position.set(camLook.x + (Math.random() - 0.5) * shake, hgt, camLook.z + back + (Math.random() - 0.5) * shake);
  camera.lookAt(camLook.x, 0, camLook.z - 0.5);
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("tag", (m, from) => { if (isHost() && m) applyTag(from, m.t); });
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  camLook.set(HIDE_START.x, 0, HIDE_START.z);
  requestAnimationFrame(frame);
})();
</script>
